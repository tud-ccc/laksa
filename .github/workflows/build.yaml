name: Build LAKSA

on:
  push:
    branches: [main, cps-tutorial]
  pull_request:
  workflow_dispatch:

env:
  LLVM_PKG_VERSION: "22.1.7-py312-release-shared"
  LLVM_PKG_RELEASE_TAG: "llvm-mlir-22.1.7-py312-release-shared"
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            llvm_asset: llvm-22-amd64.tar.zst
            gurobi_platform: linux64
          - arch: arm64
            runner: ubuntu-24.04-arm
            llvm_asset: llvm-22-arm64.tar.zst
            gurobi_platform: armlinux64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld mold xz-utils zstd curl \
            python3-dev portaudio19-dev build-essential doxygen

      - name: Download prebuilt LLVM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ env.LLVM_PKG_RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ matrix.llvm_asset }}" \
            --output /tmp/llvm.tar.zst
          sudo mkdir -p /opt
          sudo tar --use-compress-program='zstd -d' -xf /tmp/llvm.tar.zst -C /opt
          rm /tmp/llvm.tar.zst
          echo "/opt/llvm-22/build/lib" | sudo tee /etc/ld.so.conf.d/llvm-22.conf
          sudo ldconfig

      - name: Install Gurobi
        run: |
          curl -L "https://packages.gurobi.com/12.0/gurobi12.0.3_${{ matrix.gurobi_platform }}.tar.gz" -o /tmp/gurobi.tar.gz
          sudo tar xzf /tmp/gurobi.tar.gz -C /opt
          rm /tmp/gurobi.tar.gz
          echo "/opt/gurobi1203/${{ matrix.gurobi_platform }}/lib" | sudo tee /etc/ld.so.conf.d/gurobi.conf
          sudo ldconfig

      - name: Install Python deps
        run: |
          pip install --break-system-packages -r python/requirements.txt
          pip install --break-system-packages -r docs/requirements.txt

      - name: Configure
        run: |
          NANOBIND_DIR=$(python3 -c "import nanobind; print(nanobind.cmake_dir())")
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DMLIR_DIR=/opt/llvm-22/build/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm-22/build/lib/cmake/llvm \
            -DGUROBI_DIR=/opt/gurobi1203/${{ matrix.gurobi_platform }} \
            -DLLVM_USE_LINKER=mold \
            -DLLVM_EXTERNAL_LIT=/opt/llvm-22/build/bin/llvm-lit \
            -Dnanobind_DIR="$NANOBIND_DIR" \
            -DPython3_EXECUTABLE=$(which python3) \
            -DPython_EXECUTABLE=$(which python3) \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DMLIR_PYTHON_PACKAGE_PREFIX=mlir_laksa \
            -DMLIR_BINDINGS_PYTHON_INSTALL_PREFIX=mlir_laksa \
            -DMLIR_BINDINGS_PYTHON_NB_DOMAIN=mlir_laksa

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: cmake --build build --target check-laksa-mlir
        continue-on-error: true

      - name: Run Python tests
        run: cmake --build build --target check-laksa-python
        continue-on-error: true

      - name: Build Documentation
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          export SPHINXOPTS="-D html_baseurl=https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/"
          cmake --build build --target build-laksa-doc

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && matrix.arch == 'amd64' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/sphinx

  docker:
    name: docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
            MOCASIN_REF=cps-tutorial
          provenance: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.IMAGE, matrix.arch) || '' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}

      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: docker
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag=latest
          else
            tag="${GITHUB_REF_NAME//\//-}"
          fi
          docker buildx imagetools create -t "${IMAGE}:${tag}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${tag}"

  deploy-docs:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
